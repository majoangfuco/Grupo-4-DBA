# ═══════════════════════════════════════════════════════════════
# Perfil "worker" (Lab 3, punto 6 — Change Streams + $merge)
#
# Levanta el MISMO jar que el backend, pero como proceso de fondo sin
# servidor HTTP: lo único que hace es escuchar el change stream de
# `ordenes` y refrescar la vista materializada `productos_mas_vendidos`
# (ver ProductosMasVendidosWorker, anotado con @Profile("worker")).
#
# Se activa con SPRING_PROFILES_ACTIVE=worker — así lo hace el servicio
# `worker` de docker-compose.yml. En local:
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=worker
# ═══════════════════════════════════════════════════════════════

spring.application.name=backend-worker

# Sin Tomcat: no expone puertos ni compite con el backend por el 8090.
# Lo que mantiene viva la JVM es el hilo no-daemon del change stream.
spring.main.web-application-type=none

# Nombre propio en `db.currentOp()` / logs del servidor Mongo, para poder
# distinguir las conexiones del worker de las del backend HTTP.
mongo.app-name=${MONGO_APP_NAME:b2b-worker}
