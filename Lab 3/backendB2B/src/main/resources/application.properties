spring.application.name=backend
server.port=${APP_PORT:8090}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:b2b}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── MongoDB (Lab 3) ──────────────────────────────────────────────
# Por defecto apunta al replica set expuesto por docker compose desde el
# host (localhost:27017 = mongo1). Dentro de Docker, la variable MONGO_URI
# la inyecta docker-compose.yml con los dos nodos y ?replicaSet=rs0.
mongo.uri=${MONGO_URI:mongodb://b2b_app:b2b_app_pass@localhost:27017/b2b?authSource=admin&directConnection=true}
mongo.database=${MONGO_DB:b2b}
mongo.app-name=${MONGO_APP_NAME:b2b-backend}

jwt.secret=${JWT_SECRET:change-me}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# Permite recibir cuerpos JSON parciales (p. ej. crear una categoría enviando
# solo el nombre) sin fallar cuando un campo primitivo llega ausente/nulo.
spring.jackson.deserialization.fail-on-null-for-primitives=false